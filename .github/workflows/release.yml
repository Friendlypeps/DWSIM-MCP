name: release

# Tag v<engine>-fp.<n>, e.g. v10.2.12-fp.1: the prefix must be the dwsim10 tag the submodule is at.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 10.2.12-fp.1); image is pushed only for tag builds"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then v="${GITHUB_REF_NAME#v}"; else v="${{ inputs.version }}"; fi
          echo "value=$v" >> "$GITHUB_OUTPUT"
          echo "engine=${v%%-*}" >> "$GITHUB_OUTPUT"
          echo "minor=$(echo "${v%%-*}" | cut -d. -f1,2)" >> "$GITHUB_OUTPUT"

      - name: Check the submodule matches the version
        run: |
          at="$(git -C external/dwsim10 describe --tags --exact-match 2>/dev/null || git -C external/dwsim10 rev-parse --short HEAD)"
          echo "submodule at $at, version ${{ steps.version.outputs.value }}"
          [ "$at" = "v${{ steps.version.outputs.engine }}" ] || { echo "The version prefix must equal the dwsim10 tag the submodule is at."; exit 1; }

      - name: Publish both architectures
        run: VERSION=${{ steps.version.outputs.value }} scripts/publish.sh linux-x64 linux-arm64

      - name: Smoke test the amd64 publish
        run: |
          (build/publish-mcp/amd64/dwsim-mcp --http --host 127.0.0.1 --port 5901 --token ci > server.log 2>&1 &)
          scripts/smoke.sh http://127.0.0.1:5901 ci 90 || { cat server.log; exit 1; }
          pkill dwsim-mcp || true

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: build
          file: packaging/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            UPSTREAM=v${{ steps.version.outputs.engine }}
          tags: |
            ghcr.io/friendlypeps/dwsim-mcp:${{ steps.version.outputs.value }}
            ghcr.io/friendlypeps/dwsim-mcp:${{ steps.version.outputs.engine }}
            ghcr.io/friendlypeps/dwsim-mcp:${{ steps.version.outputs.minor }}
            ghcr.io/friendlypeps/dwsim-mcp:latest
